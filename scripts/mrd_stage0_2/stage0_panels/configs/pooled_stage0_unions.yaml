name: pooled_stage0_unions_v1
experiment_dir: /home/minhang/mds_project/sc_classification/experiments/20260525_060508_stage0_mrd_old34_broad_screen_82db5093
bundle_dir: /home/minhang/mds_project/sc_classification/scripts/mrd_stage0_2/stage0_panels/pooled_stage0_unions
genesets_gmt: /home/minhang/mds_project/sc_classification/scripts/mrd_stage0_2/stage0_panels/pooled_stage0_unions/pooled_unions.gmt
manifest_tsv: /home/minhang/mds_project/sc_classification/scripts/mrd_stage0_2/stage0_panels/pooled_stage0_unions/pooled_unions_manifest.tsv

stage0:
  output_branch: pooled_stage0_unions_v1
  full_control_panel_id: pooled_old34_expanded_union
  panel_types:
    - atomic_sets
    - full_control
    - hvg_anchor_control
  panel_ids:
    - old34_covered_union
    - expanded_covered_union
    - pooled_old34_expanded_union
  hvg_anchor_sizes: size_matched_to_pooled_union
  direct_gene_all_panels: true
  note: HVG anchor size is set at launch from qc/overlap_summary.json n_pooled.

stage1:
  scope: across_patient
  methods: [pca, fa, factosig, factosig_promax]
  requested_k: [5, 10, 20, 40]
  seed: 42
  small_panel_policy: direct_gene
  direct_gene_all_panels: true

stage2:
  run_id: pooled_stage0_unions_v1_stage2
  output_branch: pooled_stage0_unions_v1
  backend: gpu
  conda_env: sc-classification-rapids-py311
  launch_gpu_shards: true
  panel_selection: all_quick_rows
  c_grid_n: 13
  c_grid_log10_min: -4
  c_grid_log10_max: 4
  save_lopo_cell_predictions: true
  objectives:
    - discovery_full_cohort_fit
    - sharedness_lopo
    - patient_specific
  penalties: [l1, l2, elasticnet]
  class_weight: balanced
  seed: 42
  note: Do not launch comprehensive Stage 2 unless explicitly passing --run-stage2 to the orchestrator.
